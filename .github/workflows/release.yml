name: Release

on:
  # Pushing a version tag (e.g. v5.0.0) builds and publishes a GitHub Release.
  # `gh release create <tag>` pushes the tag, so this one trigger covers it. Do NOT
  # also listen on `release: published` — gh release create fires both, and two runs
  # racing softprops' delete-then-upload wipes each other's binaries.
  push:
    tags:
      - 'v*'

# One release run per tag — never two racing on the same assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ─── Build binaries for every platform ───────────────────────────────────────
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            artifact: maple-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            artifact: maple-darwin-arm64.tar.gz
          - goos: linux
            goarch: amd64
            artifact: maple-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            artifact: maple-linux-arm64.tar.gz
          - goos: windows
            goarch: amd64
            artifact: maple-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          make build \
            OUT="dist/maple${EXT}" \
            VERSION="${{ github.ref_name }}" \
            GOOS="${{ matrix.goos }}" \
            GOARCH="${{ matrix.goarch }}"

      - name: Archive
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip maple-windows-amd64.zip maple.exe
          else
            tar -czf maple-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz maple
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

  # ─── Collect artifacts, generate checksums, publish to release ───────────────
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      # Attach binaries to a DRAFT release first so the release is invisible to the
      # public releases API (and thus to install.sh's version scan) until every archive
      # is uploaded. Publishing an empty release up front left a window where install.sh
      # resolved the new version but 404'd on the not-yet-uploaded binary.
      - name: Upload binaries to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/maple-darwin-amd64.tar.gz
            dist/maple-darwin-arm64.tar.gz
            dist/maple-linux-amd64.tar.gz
            dist/maple-linux-arm64.tar.gz
            dist/maple-windows-amd64.zip
            dist/checksums.txt
            scripts/install.sh
            scripts/install.ps1

      # Flip to public only now that all assets are present — no 404 window.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
